name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check all JS
        run: |
          for f in $(find bin src -name '*.js'); do node --check "$f" || exit 1; done
      - name: Verify package.json is valid
        run: node -e "require('./package.json'); console.log('pkg ok')"
