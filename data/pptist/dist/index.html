<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="./favicon.ico">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PPTist - 在线演示文稿（幻灯片）应用，还原了大部分 Office PowerPoint 常用功能，实现在线PPT的编辑、演示，支持导出PPT文件，支持AI生成PPT。" />
    <meta name="keywords" content="pptist,ppt,powerpoint,office powerpoint,在线ppt,幻灯片,演示文稿,ppt在线制作,aippt" />
    <title>PPTist - 在线演示文稿</title>

    <style>
      .first-screen-loading {
        width: 200px;
        height: 200px;
        position: fixed;
        top: 50%;
        left: 50%;
        margin-top: -100px;
        margin-left: -100px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .first-screen-loading-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #d14424;
        border-top-color: transparent;
        border-radius: 50%;
        box-sizing: border-box;
        animation: spinner .8s linear infinite;
      }
      .first-screen-loading-text {
        margin-top: 20px;
        color: #d14424;
      }
      @keyframes spinner {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-Jq621B1J.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DRh6zXht.css">
  </head>
  <body>
    <div id="app">
      <div class="first-screen-loading">
        <div class="first-screen-loading-spinner"></div>
        <div class="first-screen-loading-text">正在加载中，请稍等 ...</div>
      </div>
    </div>

  </body>

  <script>
    document.oncontextmenu = e => e.preventDefault()
  </script>

  <!-- superai 注入：拦截 pptx 导入调用，把 pptxtojson 解析错误回报给右栏预览面板 -->
  <script>
    (function () {
      // 用 setter 捕获 bundle 在 onMounted 里赋值的 __pptistImportArrayBuffer，包一层 try/catch
      let _real = null;
      try {
        Object.defineProperty(window, '__pptistImportArrayBuffer', {
          configurable: true,
          get: function () {
            return function (buf, name) {
              var reportErr = function (err) {
                try { window.parent.postMessage({ source: 'pptist', type: 'pptist:error', error: String(err && err.message || err), stack: String(err && err.stack || '') }, '*'); } catch (e) {}
              };
              try {
                var ret = _real(buf, name);
                if (ret && typeof ret.then === 'function') {
                  ret.then(function () {
                    try { window.parent.postMessage({ source: 'pptist', type: 'pptist:loaded' }, '*'); } catch (e) {}
                  }, reportErr);
                } else {
                  try { window.parent.postMessage({ source: 'pptist', type: 'pptist:loaded' }, '*'); } catch (e) {}
                }
              } catch (err) {
                reportErr(err);
              }
            };
          },
          set: function (fn) {
            _real = typeof fn === 'function' ? fn : null;
          },
        });
      } catch (e) {}
    })();
  </script>
</html>
